name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: make sync
      - name: Run lint, contracts, unit tests and configuration checks
        run: make test
      - name: Build wheel and source distribution
        run: make build
      - name: Test the installed wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          make test-unit PYTHON=.venv/bin/python

  orchestration:
    name: Airflow DAG checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: airflow/uv.lock
      - run: make sync-airflow test-airflow

  source-simulator:
    name: PostgreSQL and MinIO integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: make sync
      - name: Check Docker and Compose availability
        run: |
          docker info
          docker compose version
      - name: Test simulator transactions with isolated PostgreSQL
        run: make test-source-simulator-integration
      - name: Test orders Bronze ingestion with isolated PostgreSQL and MinIO
        run: make test-bronze-integration
      - name: Test warehouse merge transactions with isolated PostgreSQL
        run: make test-warehouse-merge-integration
      - name: Test durable deferred lifecycle transactions
        run: make test-deferred-state-integration
      - name: Test pipeline control transactions and watermark CAS
        run: make test-pipeline-control-integration

  analytics:
    name: dbt models and catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked analytics dependencies
        run: make sync-analytics
      - name: Test dbt models and metric reconciliation in isolated PostgreSQL
        run: make test-dbt-integration

  silver:
    name: Spark (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: normalization-and-orders
            targets: >-
              test-processing test-silver-integration
              test-customer-integration test-order-children-integration
          - suite: dimensions-and-staging
            targets: >-
              test-product-integration test-seller-integration
              test-geolocation-integration test-review-integration
              test-item-dependencies-integration test-warehouse-integration
              test-deferred-integration
          - suite: pipeline-gates
            targets: >-
              test-pipeline-integration test-incremental-integration
              test-backfill-integration
          - suite: recovery
            targets: test-recovery-integration
    env:
      PYSPARK_SUBMIT_ARGS: --driver-memory 2g pyspark-shell
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked processing and analytics dependencies
        run: uv sync --locked --extra processing --extra analytics
      - name: Run fixture suites sequentially within each runner
        env:
          TEST_TARGETS: ${{ matrix.targets }}
        run: make $TEST_TARGETS

  benchmark:
    name: Event benchmark correctness (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      PYSPARK_SUBMIT_ARGS: --driver-memory 2g pyspark-shell
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked benchmark engines
        run: make sync-benchmark
      - name: Verify small engine fixtures and failure guards (no speed thresholds)
        run: make test-benchmark
