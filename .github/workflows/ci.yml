name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: make sync
      - name: Run lint, contracts, unit tests and configuration checks
        run: make test
      - name: Build wheel and source distribution
        run: make build
      - name: Test the installed wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          make test-unit PYTHON=.venv/bin/python

  orchestration:
    name: Airflow DAG checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: airflow/uv.lock
      - run: make sync-airflow test-airflow

  source-simulator:
    name: PostgreSQL and MinIO integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: make sync
      - name: Check Docker and Compose availability
        run: |
          docker info
          docker compose version
      - name: Test simulator transactions with isolated PostgreSQL
        run: make test-source-simulator-integration
      - name: Test orders Bronze ingestion with isolated PostgreSQL and MinIO
        run: make test-bronze-integration
      - name: Test warehouse merge transactions with isolated PostgreSQL
        run: make test-warehouse-merge-integration
      - name: Test durable deferred lifecycle transactions
        run: make test-deferred-state-integration
      - name: Test pipeline control transactions and watermark CAS
        run: make test-pipeline-control-integration
      - name: Install locked analytics dependencies
        run: make sync-analytics
      - name: Test dbt models and metric reconciliation in isolated PostgreSQL
        run: make test-dbt-integration

  silver:
    name: Core datasets Spark Silver
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked processing dependencies
        run: make sync-processing
      - name: Test Spark normalization and routing
        run: make test-processing
      - name: Test orders PostgreSQL to Bronze to Silver
        run: make test-silver-integration
      - name: Test customer snapshots and orders dependencies
        run: make test-customer-integration
      - name: Test items/payments and pinned orders dependencies
        run: make test-order-children-integration
      - name: Test three-parent item FK checks and atomic deferred retries
        run: make test-item-dependencies-integration
      - name: Test verified Silver loading into PostgreSQL staging
        run: make test-warehouse-integration
      - name: Test deferred retries against verified full snapshots
        run: make test-deferred-integration
      - name: Install processing and analytics dependencies for the pipeline gate
        run: uv sync --locked --extra processing --extra analytics
      - name: Test products snapshots and version-aware staging
        run: make test-product-integration
      - name: Test geolocation snapshots and exact coordinate staging
        run: make test-geolocation-integration
      - name: Test sellers snapshots and version-aware staging
        run: make test-seller-integration
      - name: Test all core receipts and dbt-gated watermark commit
        run: make test-pipeline-integration
      - name: Test frozen incremental windows, lookback and recovery gates
        run: make test-incremental-integration
      - name: Test isolated bounded backfills and full reload equivalence
        run: make test-backfill-integration
      - name: Test recovery after committed stages and final gate rollback
        run: make test-recovery-integration
