name: olist_analytics
version: '1.0.0'
config-version: 2
profile: olist_analytics
model-paths: [models]
test-paths: [tests]
models:
  olist_analytics:
    +materialized: view
    +grants:
      select: ["{{ env_var('DBT_READER_USER') }}"]
    marts:
      fct_orders:
        +grants:
          select: ["{{ env_var('DBT_READER_USER') }}", olist_bi_reader]
      mart_revenue_daily:
        +grants:
          select: ["{{ env_var('DBT_READER_USER') }}", olist_bi_reader]
      mart_average_order_value:
        +grants:
          select: ["{{ env_var('DBT_READER_USER') }}", olist_bi_reader]
