version: 2
sources:
- name: raw_staging
  schema: raw_staging
  tables:
  - name: customers
  - name: orders
  - name: order_items
  - name: order_payments
  - name: products
  - name: sellers
  - name: geolocation
  - name: order_reviews
models:
- name: stg_customers
  columns:
  - name: customer_id
    data_tests:
    - unique
    - not_null
- name: stg_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
- name: int_order_item_summary
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
- name: int_payment_summary
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
- name: dim_customer
  description: "One current shopper from source customers; stable MD5 business key, without synthetic unknown members."
  columns:
  - name: customer_key
    description: "MD5 of customer_unique_id; stable identifier, not an anonymization or security hash."
    data_tests:
    - unique
    - not_null
  - name: customer_unique_id
    description: "Shopper business key; representative selected by descending source_sequence then customer_id."
    data_tests:
    - unique
    - not_null
  - name: record_hash
    data_tests:
    - not_null
  - name: location_key
    description: "Nullable ZIP representative key; unmatched/invalid source ZIP stays NULL, without inferring or overwriting source location."
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_location')
          field: location_key

- name: fct_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_revenue_daily
  columns:
  - name: order_purchase_date
    data_tests:
    - unique
    - not_null
- name: mart_average_order_value
  columns:
  - name: order_purchase_date
    data_tests:
    - unique
    - not_null
- name: stg_order_items
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: order_item_id
    data_tests:
    - not_null
- name: stg_payments
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: payment_sequential
    data_tests:
    - not_null
- name: stg_products
  description: "Full product snapshots merged by source_sequence; nullable attributes retain warning flags in staging."
  columns:
  - name: product_id
    description: "Product business key; one current row per product."
    data_tests:
    - unique
    - not_null
- name: dim_product
  description: "Type 1 current product attributes; no inferred history or category translation."
  columns:
  - name: product_key
    description: "Stable MD5 hex surrogate of product_id."
    data_tests:
    - unique
    - not_null
  - name: product_id
    description: "Source business key, retained for traceability."
    data_tests:
    - unique
    - not_null
  - name: product_category_name
    description: "Normalized Portuguese category; missing values remain NULL."
  - name: product_name_length
    description: "Character count from source product_name_lenght."
  - name: product_description_length
    description: "Character count from source product_description_lenght."
  - name: product_photos_qty
    description: "Source photo count; NULL means unavailable."
  - name: product_weight_g
    description: "Nonnegative weight in grams; zero is retained with a Silver warning."
  - name: product_length_cm
    description: "Nonnegative package length in centimeters."
  - name: product_height_cm
    description: "Nonnegative package height in centimeters."
  - name: product_width_cm
    description: "Nonnegative package width in centimeters."
  - name: created_at
    description: "First warehouse observation, not source business creation time."
  - name: updated_at
    description: "Latest accepted warehouse observation, including unchanged replays."
  - name: record_hash
    description: "Canonical business-v1 hash shared with staging; excludes version and lineage."
    data_tests:
    - not_null
- name: stg_sellers
  description: "Full seller snapshots merged by source_sequence; missing locations retain warnings in staging."
  columns:
  - name: seller_id
    description: "Source business key; one current row per seller."
    data_tests:
    - unique
    - not_null
- name: dim_seller
  description: "Type 1 current seller location; no synthetic unknown members or inferred historical address; optional current ZIP representative key."
  columns:
  - name: seller_key
    description: "Stable MD5 hex surrogate of seller_id."
    data_tests:
    - unique
    - not_null
  - name: seller_id
    description: "Source business key retained for traceability."
    data_tests:
    - unique
    - not_null
  - name: seller_zip_code_prefix
    description: "Trimmed ZIP prefix; leading zeros preserved; invalid values retained with warnings."
  - name: seller_city
    description: "Trimmed lowercase source city; blank values become NULL."
  - name: seller_state
    description: "Trimmed uppercase source state; invalid values retained with warnings."
  - name: created_at
    description: "First warehouse observation, not business creation time."
  - name: updated_at
    description: "Latest accepted warehouse observation, including unchanged replay."
  - name: record_hash
    description: "Canonical business-v1 hash shared with staging; excludes source versions and lineage."
    data_tests:
    - not_null
  - name: location_key
    description: "Nullable ZIP representative key; unmatched/invalid source ZIP stays NULL, without inferring or overwriting source location."
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_location')
          field: location_key

- name: fct_order_items
  description: "One current row per (order_id, order_item_id); unallocated BRL item price/freight, all order statuses retained."
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: order_item_id
    data_tests:
    - not_null
  - name: product_id
    data_tests:
    - not_null
  - name: product_key
    description: "Current Type 1 product; missing membership fails build."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_product')
          field: product_key
  - name: seller_id
    data_tests:
    - not_null
  - name: seller_key
    description: "Current Type 1 seller; missing membership fails build."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_seller')
          field: seller_key
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_status
    data_tests:
    - not_null
  - name: is_metric_eligible
    data_tests:
    - not_null
  - name: shipping_limit_date
    data_tests:
    - not_null
  - name: price
    description: "BRL item amount; each source item row represents one unit, not an order total."
    data_tests:
    - not_null
  - name: freight_value
    description: "BRL source item freight; no payment or seller payout allocation."
    data_tests:
    - not_null
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_product_daily
  description: "One local purchase date and product; eligible item GMV/freight without payment joins. Order counts are distinct within a group, not additive across products."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: product_id
    data_tests:
    - not_null
  - name: product_key
    data_tests:
    - not_null
  - name: total_item_count
    data_tests:
    - not_null
  - name: eligible_item_count
    data_tests:
    - not_null
  - name: eligible_order_count
    data_tests:
    - not_null
  - name: gmv
    data_tests:
    - not_null
  - name: freight_amount
    data_tests:
    - not_null
- name: mart_seller_daily
  description: "One local purchase date and seller; eligible item GMV/freight without payment joins. Order counts are distinct within a group, not additive across sellers."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: seller_id
    data_tests:
    - not_null
  - name: seller_key
    data_tests:
    - not_null
  - name: total_item_count
    data_tests:
    - not_null
  - name: eligible_item_count
    data_tests:
    - not_null
  - name: eligible_order_count
    data_tests:
    - not_null
  - name: gmv
    data_tests:
    - not_null
  - name: freight_amount
    data_tests:
    - not_null

- name: fct_payments
  description: "One current row per (order_id, payment_sequential); observed BRL payment value, not multiplied by installments or allocated to items. All order statuses retained."
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: payment_sequential
    description: "Source payment-entry sequence within an order, not an installment number. Different entries may use the same type."
    data_tests:
    - not_null
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_status
    data_tests:
    - not_null
  - name: is_metric_eligible
    data_tests:
    - not_null
  - name: payment_type
    data_tests:
    - not_null
  - name: payment_installments
    data_tests:
    - not_null
  - name: payment_value
    description: "Full observed BRL amount for this payment entry; never multiply by payment_installments."
    data_tests:
    - not_null
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_payment_type_daily
  description: "One local purchase date and payment type; eligible observed gross payments, not net revenue. Order counts are distinct within each type and cannot be added across types."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: payment_type
    data_tests:
    - not_null
  - name: total_payment_count
    data_tests:
    - not_null
  - name: eligible_payment_count
    data_tests:
    - not_null
  - name: eligible_order_count
    data_tests:
    - not_null
  - name: gross_paid_amount
    data_tests:
    - not_null

- name: fct_delivery
  description: "One order, including incomplete/ineligible timelines. UTC elapsed durations; lateness uses Sao Paulo calendar dates. Invalid chronology is flagged, never silently repaired."
  columns:
  - name: order_id
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_status
    data_tests:
    - not_null
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_purchase_timestamp
    data_tests:
    - not_null
  - name: order_approved_at
    description: "Source approval milestone retained unchanged; not used to validate delivery chronology."
  - name: order_delivered_carrier_date
    description: "Nullable UTC carrier handoff."
  - name: order_delivered_customer_date
    description: "Nullable UTC actual customer delivery."
  - name: order_estimated_delivery_date
    data_tests:
    - not_null
  - name: estimated_delivery_date
    data_tests:
    - not_null
  - name: delivered_date
    description: "Nullable Sao Paulo actual delivery date, retained regardless of order status."
  - name: has_delivery_timestamp
    data_tests:
    - not_null
  - name: has_invalid_delivery_chronology
    data_tests:
    - not_null
  - name: is_delivery_observed
    data_tests:
    - not_null
  - name: delivery_delay_days
    description: "Signed local calendar days: early negative, promised day zero, late positive; NULL without a valid delivered observation."
  - name: is_late_delivery
    description: "NULL without a valid delivered observation; never inferred from wall clock."
  - name: delivery_elapsed_hours
    description: "UTC elapsed hours purchase to actual delivery, numeric, NULL for missing/invalid/non-delivered observation."
  - name: carrier_to_delivery_hours
    description: "UTC elapsed hours carrier to delivery; NULL without a valid observation or carrier milestone."
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: estimated_delivery_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: delivered_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_delivery_daily
  description: "Purchase-date cohort, not delivery-day throughput. Observed delivered timelines form the late-rate denominator; incomplete and invalid counts remain visible."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
    - unique
  - name: total_order_count
    data_tests:
    - not_null
  - name: delivered_order_count
    data_tests:
    - not_null
  - name: delivered_missing_timestamp_count
    data_tests:
    - not_null
  - name: invalid_chronology_count
    data_tests:
    - not_null
  - name: observed_delivery_count
    data_tests:
    - not_null
  - name: transit_observation_count
    data_tests:
    - not_null
  - name: late_delivery_count
    data_tests:
    - not_null
  - name: on_time_delivery_count
    data_tests:
    - not_null
  - name: late_delivery_rate
    description: "Late valid delivered observations / observed_delivery_count; NULL for an empty denominator."
  - name: avg_delivery_hours
    description: "Mean UTC purchase-to-delivery hours over observed_delivery_count; NULL when no observations."
  - name: avg_carrier_to_delivery_hours
    description: "Mean UTC carrier-to-delivery hours over transit_observation_count; NULL when carrier observations are absent."

- name: dim_date
  description: "Continuous calendar covering observed purchase, promised and actual Sao Paulo delivery dates; empty without dates. Pair ISO week with iso_year."
  columns:
  - name: date_key
    description: "Stable integer YYYYMMDD."
    data_tests:
    - not_null
    - unique
  - name: calendar_date
    data_tests:
    - not_null
    - unique
  - name: calendar_year
  - name: calendar_quarter
  - name: calendar_month
  - name: day_of_month
  - name: iso_year
  - name: iso_week
  - name: iso_day_of_week
    description: "Monday=1 through Sunday=7."
  - name: is_weekend
    description: "Saturday or Sunday; no holiday calendar is inferred."

- name: stg_geolocation
  description: "Current source observations keyed by positive CSV row position, never ZIP; coordinates remain exact NUMERIC."
  columns:
  - name: geolocation_row_id
    data_tests: [not_null, unique]
  - name: geolocation_zip_code_prefix
    data_tests: [not_null]
  - name: geolocation_lat
    data_tests: [not_null]
  - name: geolocation_lng
    data_tests: [not_null]
- name: int_geolocation_by_zip
  description: "One ZIP with exact coordinate medians; joint city/state mode, ties by state then city using C collation. All source observations count, including identical coordinates."
  columns:
  - name: zip_code_prefix
    data_tests: [not_null, unique]
- name: dim_location
  description: "Current Type 1 ZIP representatives, not exact customer/seller addresses; no inferred membership or historical locations."
  columns:
  - name: location_key
    description: "Stable MD5 of the five-character ZIP prefix."
    data_tests: [not_null, unique]
  - name: zip_code_prefix
    data_tests: [not_null, unique]
  - name: latitude
    description: "Exact numeric median over all valid source observations at this ZIP."
    data_tests: [not_null]
  - name: longitude
    description: "Exact numeric median independently of latitude; may not be an observed coordinate pair."
    data_tests: [not_null]
  - name: city
    description: "City from the modal observed valid city/state pair; NULL if no valid labels."
  - name: state
    description: "State paired with modal city; NULL if no valid labels."
  - name: sample_count
    description: "Number of physical source observations, not unique points, people or addresses."
    data_tests: [not_null]
  - name: modal_sample_count
    description: "Frequency of the chosen city/state pair; zero when labels unavailable."
    data_tests: [not_null]
  - name: created_at
    data_tests: [not_null]
  - name: updated_at
    data_tests: [not_null]
  - name: record_hash
    description: "MD5 of current representative attributes and counts; excludes observation timestamps."
    data_tests: [not_null]

- name: stg_reviews
  description: "Current full reviews at (review_id, order_id); optional text stays protected in staging."
  columns:
  - name: review_id
    description: "Review identifier; may occur for multiple orders."
    data_tests: [not_null]
  - name: order_id
    description: "Order identifier; may have several reviews. Full-parent membership is validated in Silver."
    data_tests: [not_null]
  - name: review_score
    description: "Observed integer score from 1 to 5."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [1, 2, 3, 4, 5]
          quote: false
  - name: review_comment_title
    description: "Optional original nonblank title, including case and Unicode."
  - name: review_comment_message
    description: "Optional original nonblank message; not copied into the fact or business BI."
  - name: review_creation_timestamp
    description: "UTC instant from the source review_creation_date; source local time was validated in Silver."
    data_tests: [not_null]
  - name: review_answer_timestamp
    description: "Observed UTC answer instant; not a customer-service response SLA."
    data_tests: [not_null]
  - name: source_sequence
    description: "Authoritative source version used by the warehouse merge."
  - name: source_updated_at
    description: "Source version timestamp, not the review cohort date."

- name: fct_reviews
  description: "One current row per (review_id, order_id), without order/item/payment joins or review selection per order. All observed scores retained."
  columns:
  - name: review_id
    description: "First component of the composite review grain."
    data_tests: [not_null]
  - name: order_id
    description: "Second grain component; parent validation uses the full Silver snapshot, which can exceed a bounded staging window."
    data_tests: [not_null]
  - name: review_score
    description: "Observed score; statistics weight each composite review equally, not each order."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [1, 2, 3, 4, 5]
          quote: false
  - name: review_creation_timestamp
    description: "UTC creation instant retained for traceability."
    data_tests: [not_null]
  - name: review_answer_timestamp
    description: "UTC answer instant, including chronology warnings retained by Silver."
    data_tests: [not_null]
  - name: review_creation_date
    description: "Sao Paulo calendar creation date; independent of the database session timezone."
    data_tests: [not_null]
  - name: review_creation_date_key
    description: "YYYYMMDD key into the continuous calendar, including reviews-only dates."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: has_comment_title
    description: "True for a nonblank title; text itself remains in protected staging."
    data_tests: [not_null]
  - name: has_comment_message
    description: "True for a nonblank message."
    data_tests: [not_null]
  - name: has_invalid_answer_chronology
    description: "Answer precedes creation in UTC; the valid score remains in review metrics."
    data_tests: [not_null]

- name: mart_review_daily
  description: "Review-creation cohorts, one Sao Paulo date per row. Review-weighted scores across all statuses, without revenue joins. No new BI grant."
  columns:
  - name: review_creation_date
    description: "Local review creation cohort date, not purchase or delivery date."
    data_tests: [unique, not_null]
  - name: review_count
    description: "Number of composite reviews; additive across dates."
    data_tests: [not_null]
  - name: reviewed_order_count
    description: "Distinct orders within this date; not additive across dates."
    data_tests: [not_null]
  - name: score_sum
    description: "Sum of observed scores; aggregate this with review_count to combine dates."
    data_tests: [not_null]
  - name: average_score
    description: "score_sum / review_count; never average daily means to calculate the whole-period mean."
    data_tests: [not_null]
  - name: low_score_count
    description: "Number of reviews with score 1 or 2, without inferred sentiment labels."
    data_tests: [not_null]
  - name: low_score_rate
    description: "low_score_count / review_count; aggregate counts before dividing across dates."
    data_tests: [not_null]
  - name: commented_review_count
    description: "Reviews with a nonblank title or message, counted once when both are present."
    data_tests: [not_null]
  - name: comment_rate
    description: "commented_review_count / review_count, not a measure of text sentiment."
    data_tests: [not_null]

- name: mart_customer_value
  description: "One current staged shopper, including no-order members; observed eligible order value, not predicted customer lifetime value."
  columns:
  - name: customer_key
    description: "Stable shopper key from dim_customer; no order-scoped customer_id grouping."
    data_tests:
    - unique
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: customer_unique_id
    description: "Unique shopper business key retained for traceability."
    data_tests: [unique, not_null]
  - name: total_order_count
    description: "All observed orders, including canceled/unavailable statuses; zero for no-order shoppers."
    data_tests: [not_null]
  - name: eligible_order_count
    description: "Orders in the shared eligible status set; payment completeness does not change this count."
    data_tests: [not_null]
  - name: paid_order_count
    description: "Eligible orders with positive summed payment value, counted once per order."
    data_tests: [not_null]
  - name: orders_without_items
    description: "Eligible orders with no observed item entries."
    data_tests: [not_null]
  - name: orders_without_payments
    description: "Eligible orders with no payment entries; observed zero-paid orders remain distinct."
    data_tests: [not_null]
  - name: gmv
    description: "Eligible item prices in exact BRL NUMERIC, excluding freight."
    data_tests: [not_null]
  - name: freight_amount
    description: "Observed eligible item freight in exact BRL NUMERIC."
    data_tests: [not_null]
  - name: gross_paid_amount
    description: "Observed eligible payment sums in BRL, not profit or net revenue."
    data_tests: [not_null]
  - name: average_order_value
    description: "Positive-paid eligible amount / paid_order_count, rounded to two decimals; NULL without paid orders."
  - name: first_eligible_purchase_timestamp
    description: "Earliest observed eligible order instant in UTC; NULL without eligible orders, not verified acquisition time."
  - name: last_eligible_purchase_timestamp
    description: "Latest observed eligible order instant in UTC; NULL without eligible orders."
  - name: is_repeat_customer
    description: "At least two observed eligible orders in current staging, including unpaid/zero-paid orders."
    data_tests: [not_null]

- name: mart_repeat_purchase_daily
  description: "One observed eligible local purchase date; first/repeat classification over current staged history by shopper, UTC instant then order_id."
  columns:
  - name: order_purchase_date
    description: "Sao Paulo purchase date inherited from orders; empty eligible input yields no rows."
    data_tests: [unique, not_null]
  - name: eligible_order_count
    description: "All observed eligible orders, regardless of payment completeness."
    data_tests: [not_null]
  - name: first_order_count
    description: "Each shopper's first observed eligible order; ties break by order_id."
    data_tests: [not_null]
  - name: repeat_order_count
    description: "Observed eligible orders after that shopper's first order."
    data_tests: [not_null]
  - name: purchasing_customer_count
    description: "Distinct shoppers within this date; not additive across dates."
    data_tests: [not_null]
  - name: repeat_customer_count
    description: "Distinct shoppers with a repeat order on this date; a shopper may also have a first order here."
    data_tests: [not_null]
  - name: repeat_order_rate
    description: "repeat_order_count / eligible_order_count; combine counts before dividing over multiple dates."
    data_tests: [not_null]

- name: mart_order_status_daily
  description: "One local purchase date and current order status, across all observed statuses; counts only, no inferred historical status transitions."
  columns:
  - name: order_purchase_date
    description: "Sao Paulo order purchase cohort, not status update date."
    data_tests: [not_null]
  - name: order_status
    description: "Current source status retained at order grain."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [delivered, shipped, invoiced, processing, approved, created, canceled, unavailable]
  - name: order_count
    description: "Orders in this status/date; additive across groups."
    data_tests: [not_null]
  - name: customer_count
    description: "Distinct shoppers in this status/date; not additive across statuses or dates."
    data_tests: [not_null]
