version: 2
sources:
- name: raw_staging
  schema: raw_staging
  tables:
  - name: customers
  - name: orders
  - name: order_items
  - name: order_payments
  - name: products
  - name: sellers
models:
- name: stg_customers
  columns:
  - name: customer_id
    data_tests:
    - unique
    - not_null
- name: stg_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
- name: int_order_item_summary
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
- name: int_payment_summary
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
- name: dim_customer
  columns:
  - name: customer_key
    data_tests:
    - unique
    - not_null
  - name: customer_unique_id
    data_tests:
    - unique
    - not_null
  - name: record_hash
    data_tests:
    - not_null
- name: fct_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_revenue_daily
  columns:
  - name: order_purchase_date
    data_tests:
    - unique
    - not_null
- name: mart_average_order_value
  columns:
  - name: order_purchase_date
    data_tests:
    - unique
    - not_null
- name: stg_order_items
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: order_item_id
    data_tests:
    - not_null
- name: stg_payments
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: payment_sequential
    data_tests:
    - not_null
- name: stg_products
  description: "Full product snapshots merged by source_sequence; nullable attributes retain warning flags in staging."
  columns:
  - name: product_id
    description: "Product business key; one current row per product."
    data_tests:
    - unique
    - not_null
- name: dim_product
  description: "Type 1 current product attributes; no inferred history or category translation."
  columns:
  - name: product_key
    description: "Stable MD5 hex surrogate of product_id."
    data_tests:
    - unique
    - not_null
  - name: product_id
    description: "Source business key, retained for traceability."
    data_tests:
    - unique
    - not_null
  - name: product_category_name
    description: "Normalized Portuguese category; missing values remain NULL."
  - name: product_name_length
    description: "Character count from source product_name_lenght."
  - name: product_description_length
    description: "Character count from source product_description_lenght."
  - name: product_photos_qty
    description: "Source photo count; NULL means unavailable."
  - name: product_weight_g
    description: "Nonnegative weight in grams; zero is retained with a Silver warning."
  - name: product_length_cm
    description: "Nonnegative package length in centimeters."
  - name: product_height_cm
    description: "Nonnegative package height in centimeters."
  - name: product_width_cm
    description: "Nonnegative package width in centimeters."
  - name: created_at
    description: "First warehouse observation, not source business creation time."
  - name: updated_at
    description: "Latest accepted warehouse observation, including unchanged replays."
  - name: record_hash
    description: "Canonical business-v1 hash shared with staging; excludes version and lineage."
    data_tests:
    - not_null
- name: stg_sellers
  description: "Full seller snapshots merged by source_sequence; missing locations retain warnings in staging."
  columns:
  - name: seller_id
    description: "Source business key; one current row per seller."
    data_tests:
    - unique
    - not_null
- name: dim_seller
  description: "Type 1 current seller location; no inferred historical address or geolocation join."
  columns:
  - name: seller_key
    description: "Stable MD5 hex surrogate of seller_id."
    data_tests:
    - unique
    - not_null
  - name: seller_id
    description: "Source business key retained for traceability."
    data_tests:
    - unique
    - not_null
  - name: seller_zip_code_prefix
    description: "Trimmed ZIP prefix; leading zeros preserved; invalid values retained with warnings."
  - name: seller_city
    description: "Trimmed lowercase source city; blank values become NULL."
  - name: seller_state
    description: "Trimmed uppercase source state; invalid values retained with warnings."
  - name: created_at
    description: "First warehouse observation, not business creation time."
  - name: updated_at
    description: "Latest accepted warehouse observation, including unchanged replay."
  - name: record_hash
    description: "Canonical business-v1 hash shared with staging; excludes source versions and lineage."
    data_tests:
    - not_null

- name: fct_order_items
  description: "One current row per (order_id, order_item_id); unallocated BRL item price/freight, all order statuses retained."
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: order_item_id
    data_tests:
    - not_null
  - name: product_id
    data_tests:
    - not_null
  - name: product_key
    description: "Current Type 1 product; missing membership fails build."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_product')
          field: product_key
  - name: seller_id
    data_tests:
    - not_null
  - name: seller_key
    description: "Current Type 1 seller; missing membership fails build."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_seller')
          field: seller_key
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_status
    data_tests:
    - not_null
  - name: is_metric_eligible
    data_tests:
    - not_null
  - name: shipping_limit_date
    data_tests:
    - not_null
  - name: price
    description: "BRL item amount; each source item row represents one unit, not an order total."
    data_tests:
    - not_null
  - name: freight_value
    description: "BRL source item freight; no payment or seller payout allocation."
    data_tests:
    - not_null
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_product_daily
  description: "One local purchase date and product; eligible item GMV/freight without payment joins. Order counts are distinct within a group, not additive across products."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: product_id
    data_tests:
    - not_null
  - name: product_key
    data_tests:
    - not_null
  - name: total_item_count
    data_tests:
    - not_null
  - name: eligible_item_count
    data_tests:
    - not_null
  - name: eligible_order_count
    data_tests:
    - not_null
  - name: gmv
    data_tests:
    - not_null
  - name: freight_amount
    data_tests:
    - not_null
- name: mart_seller_daily
  description: "One local purchase date and seller; eligible item GMV/freight without payment joins. Order counts are distinct within a group, not additive across sellers."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: seller_id
    data_tests:
    - not_null
  - name: seller_key
    data_tests:
    - not_null
  - name: total_item_count
    data_tests:
    - not_null
  - name: eligible_item_count
    data_tests:
    - not_null
  - name: eligible_order_count
    data_tests:
    - not_null
  - name: gmv
    data_tests:
    - not_null
  - name: freight_amount
    data_tests:
    - not_null

- name: fct_payments
  description: "One current row per (order_id, payment_sequential); observed BRL payment value, not multiplied by installments or allocated to items. All order statuses retained."
  columns:
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: payment_sequential
    description: "Source payment-entry sequence within an order, not an installment number. Different entries may use the same type."
    data_tests:
    - not_null
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_status
    data_tests:
    - not_null
  - name: is_metric_eligible
    data_tests:
    - not_null
  - name: payment_type
    data_tests:
    - not_null
  - name: payment_installments
    data_tests:
    - not_null
  - name: payment_value
    description: "Full observed BRL amount for this payment entry; never multiply by payment_installments."
    data_tests:
    - not_null
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_payment_type_daily
  description: "One local purchase date and payment type; eligible observed gross payments, not net revenue. Order counts are distinct within each type and cannot be added across types."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: payment_type
    data_tests:
    - not_null
  - name: total_payment_count
    data_tests:
    - not_null
  - name: eligible_payment_count
    data_tests:
    - not_null
  - name: eligible_order_count
    data_tests:
    - not_null
  - name: gross_paid_amount
    data_tests:
    - not_null

- name: fct_delivery
  description: "One order, including incomplete/ineligible timelines. UTC elapsed durations; lateness uses Sao Paulo calendar dates. Invalid chronology is flagged, never silently repaired."
  columns:
  - name: order_id
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: customer_key
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: order_status
    data_tests:
    - not_null
  - name: order_purchase_date
    data_tests:
    - not_null
  - name: order_purchase_timestamp
    data_tests:
    - not_null
  - name: order_approved_at
    description: "Source approval milestone retained unchanged; not used to validate delivery chronology."
  - name: order_delivered_carrier_date
    description: "Nullable UTC carrier handoff."
  - name: order_delivered_customer_date
    description: "Nullable UTC actual customer delivery."
  - name: order_estimated_delivery_date
    data_tests:
    - not_null
  - name: estimated_delivery_date
    data_tests:
    - not_null
  - name: delivered_date
    description: "Nullable Sao Paulo actual delivery date, retained regardless of order status."
  - name: has_delivery_timestamp
    data_tests:
    - not_null
  - name: has_invalid_delivery_chronology
    data_tests:
    - not_null
  - name: is_delivery_observed
    data_tests:
    - not_null
  - name: delivery_delay_days
    description: "Signed local calendar days: early negative, promised day zero, late positive; NULL without a valid delivered observation."
  - name: is_late_delivery
    description: "NULL without a valid delivered observation; never inferred from wall clock."
  - name: delivery_elapsed_hours
    description: "UTC elapsed hours purchase to actual delivery, numeric, NULL for missing/invalid/non-delivered observation."
  - name: carrier_to_delivery_hours
    description: "UTC elapsed hours carrier to delivery; NULL without a valid observation or carrier milestone."
  - name: order_purchase_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: estimated_delivery_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: delivered_date_key
    description: "YYYYMMDD key for the corresponding Sao Paulo calendar date."
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key

- name: mart_delivery_daily
  description: "Purchase-date cohort, not delivery-day throughput. Observed delivered timelines form the late-rate denominator; incomplete and invalid counts remain visible."
  columns:
  - name: order_purchase_date
    data_tests:
    - not_null
    - unique
  - name: total_order_count
    data_tests:
    - not_null
  - name: delivered_order_count
    data_tests:
    - not_null
  - name: delivered_missing_timestamp_count
    data_tests:
    - not_null
  - name: invalid_chronology_count
    data_tests:
    - not_null
  - name: observed_delivery_count
    data_tests:
    - not_null
  - name: transit_observation_count
    data_tests:
    - not_null
  - name: late_delivery_count
    data_tests:
    - not_null
  - name: on_time_delivery_count
    data_tests:
    - not_null
  - name: late_delivery_rate
    description: "Late valid delivered observations / observed_delivery_count; NULL for an empty denominator."
  - name: avg_delivery_hours
    description: "Mean UTC purchase-to-delivery hours over observed_delivery_count; NULL when no observations."
  - name: avg_carrier_to_delivery_hours
    description: "Mean UTC carrier-to-delivery hours over transit_observation_count; NULL when carrier observations are absent."

- name: dim_date
  description: "Continuous calendar covering observed purchase, promised and actual Sao Paulo delivery dates; empty without dates. Pair ISO week with iso_year."
  columns:
  - name: date_key
    description: "Stable integer YYYYMMDD."
    data_tests:
    - not_null
    - unique
  - name: calendar_date
    data_tests:
    - not_null
    - unique
  - name: calendar_year
  - name: calendar_quarter
  - name: calendar_month
  - name: day_of_month
  - name: iso_year
  - name: iso_week
  - name: iso_day_of_week
    description: "Monday=1 through Sunday=7."
  - name: is_weekend
    description: "Saturday or Sunday; no holiday calendar is inferred."
