[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "olist-data-platform"
version = "0.1.0"
description = "Olist source validation and batch data platform utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.40,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
olist-verify-raw = "olist_platform.raw.verification:main"
olist-profile-source = "olist_platform.raw.profiling:main"
olist-validate-source-contract = "olist_platform.raw.contracts:main"
olist-verify-source-schema = "olist_platform.raw.schema:main"
olist-source-simulator = "olist_platform.source_simulator.cli:main"
olist-bronze-orders = "olist_platform.bronze.cli:main"
olist-silver-orders = "olist_platform.silver.cli:main"
olist-bronze-source = "olist_platform.bronze.cli:main"
olist-silver-source = "olist_platform.silver.cli:main"
olist-load-warehouse = "olist_platform.warehouse.cli:main"

[project.optional-dependencies]
processing = [
    "pyspark==4.0.2",
]
analytics = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/olist_platform"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
